services:
  - type: web
    name: festivo-backend
    runtime: node
    region: singapore  # Closest to India
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # You'll set this manually in dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REDIS_ENABLED
        value: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      # Set the values below in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        value: Festivo
      # Online payments stay disabled until both keys are set
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: BOOKING_COMMISSION_PERCENT
        value: 15
      - key: TICKET_FEE_PERCENT
        value: 5
